version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
      time: "17:00"
      timezone: "Europe/Paris"
    cooldown:
      default-days: 3
      exclude:
        - "io.github.nbauma109:*"

  - package-ecosystem: "github-actions"
    directory: "/" # Location of GitHub Actions workflows
    schedule:
      interval: "daily"
      time: "17:00"
      timezone: "Europe/Paris"
